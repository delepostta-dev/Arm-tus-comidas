 salmón y salteá la espinaca un minuto.;Pescado al horno con calabaza|c|s|30|Pescado,Calabaza,Aceite de oliva|Horneá el pescado y la calabaza con aceite y condimentos unos 20 minutos.;Tofu salteado con arroz y verduras|ac|s|20|Tofu,Arroz,Verduras congeladas,Morrón|Salteá el tofu en cubos con verduras. Servilo sobre el arroz.;Hummus con zanahoria y pepino|ms|s|5|Hummus,Zanahoria,Pepino|Cortá las verduras en bastones y mojá en el hummus.;Yogur griego con fruta y almendras|dms|d|3|Yogur griego,Manzana,Almendras|Cortá la fruta sobre el yogur y sumá las almendras.;Tostada con mantequilla de maní y banana|dms|d|5|Pan integral,Mantequilla de maní,Banana|Untá la tostada y sumá rodajas de banana.;Leche con banana y cacao|ms|d|3|Leche,Banana,Cacao|Licuá o mezclá todo. Se toma frío o tibio.;Tostada con queso y tomate|dms|s|5|Pan integral,Queso,Tomate|Tostá el pan, sumá queso y tomate. Si querés, gratinalo.;Ricota con miel y durazno|ms|d|3|Ricota,Miel,Durazno|Serví la ricota con durazno en trozos y un hilo de miel.;Fruta con frutos secos|s|d|2|Manzana,Nueces,Almendras|Una fruta y un puñado de frutos secos.;Pan con atún y pepino|mcs|s|5|Pan integral,Atún,Pepino|Mezclá el atún con pepino picado y rellená el pan.`.split(';').map(s=>{const a=s.split('|');return{n:a[0],m:a[1],t:a[2],min:+a[3],i:a[4].split(','),s:a[5]}});

function pan(i){const f=F[i],k=S.pantry.indexOf(f.n);k>=0?S.pantry.splice(k,1):S.pantry.push(f.n);draw(1)}
function res(){const q=S.q.toLowerCase();$('#res').innerHTML=foodChips(F.filter(f=>(S.cat=='*'||f.c.includes(S.cat))&&f.n.toLowerCase().includes(q)))}
function draw(keep){const y=scrollY;const active=document.activeElement;const focusAction=active?.tagName=='BUTTON'?active.getAttribute('onclick'):null;$('#app').innerHTML=V[S.v]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==(S.v=='pick'?S.next:S.v=='meal'?'home':S.v)));if(S.v=='build'&&S.mode=='l')res();if(keep){scrollTo(0,y);if(focusAction)[...document.querySelectorAll('button')].find(b=>b.getAttribute('onclick')==focusAction)?.focus({preventScroll:true})}}
const meals=to=>Object.entries(M).map(([k,v])=>categoryButton(k,v,`pickMeal('${k}','${to}')`)).join('');
function sug(){const it=S.items;if(!it.length)return'Sumá alimentos y te voy sugiriendo cómo completar la comida.';
const has=GR.map(g=>it.some(x=>[...x.c].some(c=>g.includes(c))));const ms=['alguna fuente de proteína, como huevo, pollo, atún o legumbres','una fuente de energía, como arroz, papa, pasta o pan','verduras o fruta','algo de grasa, como palta, aceite de oliva o frutos secos'];
if(S.meal=='s')return has[0]||has[1]?'Combinación simple y práctica. Alcanza como colación.':'Si querés algo más saciante, podrías sumar proteína (yogur, huevo, queso) o energía (pan, fruta).';
const n=has.filter(Boolean).length,miss=ms.filter((_,i)=>!has[i]);
return n==4?'Ya tenés fuente de proteína, energía, vegetales y grasas. Podés combinar estos ingredientes en un plato sencillo.':`Ya tenés una buena base. Podrías agregar ${miss.slice(0,2).join(' o ')} si querés completarla.`}
function prep(){const nm=S.items.map(x=>x.n);const c=R.filter(r=>r.m.includes(S.meal)&&r.i.every(i=>nm.includes(i))).sort((a,b)=>b.i.length-a.i.length)[0];
return c?`<p class="tip"><b>${c.n}.</b> ${c.s}</p>`:S.items.length>1?`<p class="tip">Podés combinar: ${nm.join(', ')}.</p>`:''}
function focusGroup(i){S.mode='g';draw(1);document.getElementById('group-'+i).scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'center'});document.querySelector('#group-'+i+' + button')?.focus({preventScroll:true})}
function plate(){return`<div class="plate" aria-label="Alimentos de tu plato">${GR.map((g,i)=>{const l=S.items.filter(x=>[...x.c].some(c=>g.includes(c)));return`<button class="${l.length?'on':''}" onclick="focusGroup(${i})" aria-label="Elegir ${GL[i]}"><small>${GL[i]}</small><span>${l.map(x=>x.n).join(', ')||'+ Elegir'}</span></button>`}).join('')}</div>`}
function setP(i,v){S.items[i].p=v}
function addC(){const v=$('#cu').value.trim();if(v){S.items.push({n:v,c:'O',p:''});draw(1)}}
function toast(message){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=message;document.body.append(el);setTimeout(()=>el.remove(),3200)}
function save(){if(!S.items.length){toast('Sumá al menos un alimento para guardar tu comida');return}const o={id:S.eid||Date.now(),meal:S.meal,name:($('#nm').value.trim()||S.items.map(x=>x.n).slice(0,3).join(' + ')),items:S.items};const k=saved.findIndex(x=>x.id==o.id);k>=0?saved[k]=o:saved.push(o);S.eid=o.id;store();toast('Comida guardada en Mis comidas')}
function ideas(){const sel=S.pantry;S.ideas=R.filter(r=>r.m.includes(S.meal)&&r.min<=S.tmax&&(S.pref=='*'||r.t==S.pref||!'dms'.includes(S.meal)||!'ds'.includes(S.pref))).map(r=>{const h=r.i.filter(i=>sel.includes(i));return{r,h,x:r.i.filter(i=>!sel.includes(i)),k:h.length/r.i.length}}).filter(o=>o.h.length&&o.k>=.5).sort((a,b)=>b.k-a.k||a.x.length-b.x.length).slice(0,5);draw()}
function useR(i){const r=R[i];S.items=r.i.map(n=>({...mk(n)}));S.eid=null;S.v='build';draw()}
function open(id,dup){const o=saved.find(x=>x.id==id);S.meal=o.meal;S.items=JSON.parse(JSON.stringify(o.items));S.eid=dup?null:o.id;S.name=dup?o.name+' (copia)':o.name;S.v='build';draw()}
function del(id){if(confirm('¿Eliminar esta comida?')){saved=saved.filter(x=>x.id!=id);store();draw()}}
const V={
home:()=>`<div class="home-layout"><section class="intro"><div class="eyebrow">Mi plato</div><h1>¿Qué te gustaría <em>comer hoy?</em></h1><p>Elegí una comida para combinar alimentos o buscar ideas con lo que tenés.</p><svg class="food-art" viewBox="0 0 370 240" fill="none" role="img" aria-label="Ilustración de un plato con vegetales"><ellipse cx="185" cy="210" rx="125" ry="13" fill="#e8ebdf"/><circle cx="185" cy="119" r="99" fill="#fffefb" stroke="#dce1d1"/><circle cx="185" cy="119" r="79" fill="#f0f0e3" stroke="#e3e5d5"/><path d="M137 78c-40 8-31 55 1 48-18 30 19 43 32 20 17 10 34-15 11-26 12-26-17-50-31-25Z" fill="#788f55"/><path d="m125 110 41 18m-28-39 18 43" stroke="#b8c596" stroke-width="2"/><path d="M209 64c22-8 48 13 42 38-25 8-49-10-42-38Z" fill="#b2bf83"/><path d="m215 72 29 22" stroke="#e6ebca" stroke-width="2"/><path d="M205 122c-18-19-45 0-39 21 8 26 40 25 48 6 4-9-1-21-9-27Z" fill="#e4b977"/><path d="m175 137 29 9m-25-20 27 9m-28 11 20 8" stroke="#c89651" stroke-width="2"/><circle cx="226" cy="135" r="17" fill="#bd7255"/><circle cx="226" cy="135" r="12" stroke="#e4a180" stroke-width="2"/><path d="m225 126 1 7 7-2m-15 9 6-3 5 7" stroke="#edc0a1" stroke-width="2"/><path d="M200 159c-3-15 19-22 26-10 6 14-17 29-26 10Z" fill="#859758"/><path d="m204 162 15-10" stroke="#cbd4a5" stroke-width="2"/><path d="M61 52v124m-9-124v29q9 15 18 0V52m-9 124v23m251-147v147m0-147q-21 27 0 61" stroke="#a0ab8e" stroke-width="4" stroke-linecap="round"/><path d="m282 27 4-8m-1 19 9-2M85 183l-8 5" stroke="#a4b17b" stroke-width="2" stroke-linecap="round"/></svg></section><section class="categories"><div class="category-heading"><h2>¿Por dónde empezamos?</h2></div>${Object.entries(M).map(([k,v])=>categoryButton(k,v,`pickMeal('${k}','meal')`)).join('')}</section></div>`,
pick:()=>`<h1>${S.next=='build'?'Armar mi plato':'Buscar ideas'}</h1><p>¿Qué comida querés resolver?</p>${meals(S.next)}`,
meal:()=>`<h1>${M[S.meal]}</h1><button class="card big" onclick="pickMeal('${S.meal}','build')"><b>Armar mi plato</b><small>Elegí alimentos y mirá cómo queda tu plato.</small></button><button class="card big" onclick="pickMeal('${S.meal}','ideas')"><b>Buscar ideas</b><small>Buscá recetas con los ingredientes que tenés.</small></button><button class="ghost" onclick="go('home')">← Volver</button>`,
build:()=>{const g=S.mode=='g';return`<div class="builder-heading"><div><p class="eyebrow">Mi plato · ${M[S.meal]}</p><h1>Armá tu plato</h1></div><button class="ghost" onclick="go('pick','build')">Cambiar comida</button></div><div class="selection-status" role="status">${S.items.length?`${S.items.length} alimento${S.items.length==1?' elegido':'s elegidos'}`:'Elegí alimentos para empezar'}<a href="#your-plate">Ver mi plato ↓</a></div><div class="seg">${chip('Guiado',g,"S.mode='g';draw(1)")}${chip('Libre',!g,"S.mode='l';draw(1)")}</div>`+
(g?GR.map((r,i)=>`<h3 id="group-${i}">${i+1}. ${GL[i]}</h3>${foodChips(F.filter(f=>[...f.c].some(c=>r.includes(c))))}`).join(''):`<h3>Buscar alimentos</h3><input aria-label="Buscar alimentos" placeholder="Buscar por nombre…" value="${S.q}" oninput="S.q=this.value;res()"><div style="margin-top:8px">${chip('Todos',S.cat=='*',"S.cat='*';draw(1)")}${Object.entries(CN).map(([k,v])=>chip(v,S.cat==k,`S.cat='${k}';draw(1)`)).join('')}</div><div id="res"></div>`)+
`<h3>¿Otro alimento?</h3><div style="display:flex;gap:8px"><input aria-label="Otro alimento" id="cu" placeholder="Agregá uno propio"><button onclick="addC()">Agregar</button></div><h3 id="your-plate" tabindex="-1">Tu plato</h3>${plate()}${S.items.map((x,i)=>`<div class="row"><span>${x.n}</span><span><select onchange="setP(${i},this.value)">${[...new Set([x.p,...PO])].map(o=>`<option ${o==x.p?'selected':''} value="${o}">${o||'Sin especificar'}</option>`).join('')}</select><button class="x" aria-label="Quitar ${x.n}" onclick="S.items.splice(${i},1);draw(1)">×</button></span></div>`).join('')}<p>${sug()}</p>${prep()}<p class="mut">Las porciones son referencias prácticas para orientarte. Tus necesidades pueden variar según tu actividad, objetivos, contexto y nivel de hambre.</p><details class="card"><summary>Referencias visuales</summary><p>Palma: proteínas. Puño: frutas, verduras y algunos carbohidratos. Mano ahuecada: arroz, pasta o cereales cocidos. Pulgar: untables y aceites.</p></details><h3>Guardar</h3><input aria-label="Nombre de tu plato" id="nm" placeholder="Nombre (opcional)" value="${S.name||''}"><button class="btn" onclick="save()">Guardar en Mis comidas</button><button class="ghost btn" onclick="S.items=[];S.eid=null;S.name='';draw()">Empezar de nuevo</button>`},
ideas:()=>{const t=[[5,'Menos de 5 min'],[15,'5 a 15 min'],[999,'Más de 15 min']];return`<h1>Buscar ideas · ${M[S.meal]}</h1><h3>¿Qué tenés disponible?</h3>${Object.entries(CN).filter(([k])=>k!='O').map(([k,v])=>`<p>${v}</p>${F.filter(f=>f.c[0]==k).map(f=>chip(f.n,S.pantry.includes(f.n),`pan(${F.indexOf(f)})`)).join('')}`).join('')}${'dms'.includes(S.meal)?`<h3>Preferencia</h3><div class="seg">${[['*','Da igual'],['d','Dulce'],['s','Salado']].map(([k,v])=>chip(v,S.pref==k,`S.pref='${k}';draw(1)`)).join('')}</div>`:''}<h3>Tiempo</h3><div class="seg">${t.map(([k,v])=>chip(v,S.tmax==k,`S.tmax=${k};draw(1)`)).join('')}</div><button class="btn" onclick="ideas()">Buscar ideas</button>`+(S.ideas?(S.ideas.length?S.ideas.map(o=>`<div class="card"><b>${o.r.n}</b><p class="mut">${o.r.min} min aprox.</p><p>${o.r.i.map(i=>`${i} (${mk(i).p||'a gusto'})`).join(' · ')}</p><p>${o.r.s}</p>${o.x.length?`<p class="mut">Te falta: ${o.x.map(x=>`${x} → podés usar ${subs(x).slice(0,3).join(', ')}`).join('; ')}</p>`:''}<button class="btn" onclick="useR(${R.indexOf(o.r)})">Usar esta combinación</button></div>`).join(''):'<p>Con esa selección no encontré ideas. Probá sumando algún alimento más o cambiando el tiempo.</p>'):'')},
saved:()=>`<h1>Mis comidas</h1>${saved.length?Object.entries(M).map(([k,v])=>{const l=saved.filter(x=>x.meal==k);return l.length?`<h3>${v}</h3>${l.map(o=>`<div class="card"><b>${o.name}</b><p>${o.items.map(x=>x.n).join(', ')}</p><button onclick="open(${o.id})">Abrir y editar</button> <button onclick="open(${o.id},1)">Duplicar</button> <button onclick="del(${o.id})">Eliminar</button></div>`).join('')}`:''}).join(''):'<p>Todavía no guardaste ninguna comida. Armá una y guardala para volver a usarla.</p>'}`};
document.querySelectorAll('nav button').forEach(b=>{b.innerHTML=icon(b.dataset.v)+`<span>${b.textContent}</span>`});
draw();
</script></body></html>
